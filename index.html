<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>time-o-meter</title>
    <link rel="icon" href="favicon.jpg" type="image/jpeg">
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="dashboard">
        <button id="toggle-settings" class="icon-btn" aria-label="Settings">
            <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <circle cx="12" cy="12" r="3"></circle>
                <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"></path>
            </svg>
        </button>

        <div class="cluster-wrapper">
            
            <!-- SPEED GAUGE -->
            <div class="gauge-container">
                <svg class="gauge-svg" viewBox="0 0 240 240">
                    <defs>
                        <linearGradient id="speed-grad" x1="0%" y1="0%" x2="100%" y2="0%">
                            <stop offset="0%" stop-color="var(--accent-color)" stop-opacity="0" />
                            <stop offset="100%" stop-color="var(--accent-color)" stop-opacity="1" />
                        </linearGradient>
                    </defs>
                    <circle class="gauge-bezel" cx="120" cy="120" r="115"></circle>
                    <g id="speed-ticks"></g>
                    <circle class="gauge-track speed-track" cx="120" cy="120" r="100"></circle>
                    <circle id="speed-arc" class="gauge-fill speed-fill" cx="120" cy="120" r="100"></circle>
                    <g id="speed-needle" style="transition: transform 0.2s linear; transform-origin: 120px 120px;">
                        <polygon points="211,120 223,114 223,126" fill="var(--accent-color)" stroke="#9c7a10" stroke-width="2" stroke-linejoin="round" />
                    </g>
                </svg>
                <div class="gauge-center">
                    <div id="speed-val" class="gauge-value">0</div>
                    <div id="speed-unit-lbl" class="gauge-unit">km/h</div>
                    <div class="gauge-label">Speed</div>
                </div>
            </div>

            <!-- PACE GAUGE -->
            <div class="gauge-container">
                <svg class="gauge-svg" viewBox="0 0 240 240">
                    <defs>
                        <linearGradient id="pace-grad" x1="0%" y1="0%" x2="100%" y2="0%">
                            <stop offset="0%" stop-color="#10b981" stop-opacity="0" />
                            <stop offset="100%" stop-color="#10b981" stop-opacity="1" />
                        </linearGradient>
                    </defs>
                    <circle class="gauge-bezel" cx="120" cy="120" r="115"></circle>
                    <g id="pace-ticks"></g>
                    <circle class="gauge-track pace-track" cx="120" cy="120" r="100"></circle>
                    <circle id="pace-arc" class="gauge-fill pace-fill" cx="120" cy="120" r="100"></circle>
                    <g id="pace-needle" style="transition: transform 0.2s linear; transform-origin: 120px 120px;">
                        <polygon points="211,120 223,114 223,126" fill="var(--pace-color)" stroke="#047857" stroke-width="2" stroke-linejoin="round" />
                    </g>
                </svg>
                <div class="gauge-center">
                    <div id="pace-val" class="gauge-value">∞</div>
                    <div id="pace-unit-lbl" class="gauge-unit">min/km</div>
                    <div class="gauge-label">Pace</div>
                </div>
            </div>

        </div>
    </div>

    <!-- SETTINGS MODAL -->
    <dialog id="settings-modal">
        <div class="modal-header">
            <h2 class="modal-title">Settings</h2>
            <button id="close-settings" class="close-btn">&times;</button>
        </div>
        <div style="display: flex; flex-direction: column; gap: 1.5rem; width: 100%; align-items: center;">
            <!-- Mode Toggle -->
            <div class="controls-row" style="width: 100%; justify-content: center;">
                <button class="mode-btn btn-pill active" data-mode="gps">GPS Mode</button>
                <button class="mode-btn btn-pill" data-mode="preview">Slider Preview</button>
            </div>
            
            <!-- Units -->
            <div class="controls-row" style="width: 100%; justify-content: center;">
                <button class="unit-btn btn-pill active" data-unit="kmh">km/h</button>
                <button class="unit-btn btn-pill" data-unit="mph">mph</button>
            </div>
            
            <!-- Preview Slider -->
            <div id="preview-container" style="display: none; width: 100%;">
                <label style="font-size: 0.8rem; color: #64748b; margin-bottom: 0.5rem; display: block; text-align: center;">Preview Speed</label>
                <input type="range" id="preview-slider" min="0" max="100" value="0">
            </div>

            <div style="width: 100%; height: 1px; background: #333; margin: 0.5rem 0;"></div>

            <!-- GPS Start Button -->
            <button id="btn-start" style="width: 100%; padding: 0.75rem 1.5rem;">START GPS</button>
            
            <div id="status" class="status" style="width: 100%;">System Ready</div>
            <div id="debug" style="font-size: 0.65rem; color: #475569; text-align: left; display: none; font-family: monospace; width: 100%;"></div>
        </div>
    </dialog>

    <script src="script.js"></script>
</body>
</html>
